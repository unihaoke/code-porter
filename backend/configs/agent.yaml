# CodePorter LocalAgent 配置
# 多租户版本：客户端凭「连接秘钥」接入，不再使用静态 token。
# 密钥建议通过环境变量 AGENT_KEY 注入（见 .env.example），本文件只存非敏感配置。

agent:
  # id 留空：首次启动自动生成 agt_<随机> 并写回本文件（每台机器唯一，请勿手动复制到其他机器）
  id: ""
  # name 留空：首次启动自动取主机名
  name: ""
  # 连接秘钥：在网关控制台「秘钥」页创建（勾选 agent 权限）后粘贴。
  # 生产环境建议留空并通过环境变量 AGENT_KEY 注入，避免写入 yaml。
  key: ""

gateway:
  addr: "http://127.0.0.1:9022"
  timeout: 30s
  insecure_tls: false

pull:
  interval_min: 500ms
  interval_max: 3s
  backoff_factor: 1.6

worker_pool:
  max_concurrency: 2
  queue_size: 4

direct:
  enabled: true
  heartbeat_interval: 20s
  pong_timeout: 60s
  reconnect_min: 1s
  reconnect_max: 30s

health:
  interval: 15s

# 本地 IM 机器人（可选）。
# 飞书机器人直接运行在本客户端：通过官方长连接（WebSocket 出站）接收消息，
# 本机调用 AI 工具处理后用 OpenAPI 回复，不经过网关、不需要公网域名/加密配置。
# 前置：飞书开放平台企业自建应用开启「机器人」能力，事件订阅选择
# 「使用长连接接收事件」并添加 im.message.receive_v1，然后发布版本。
bots:
  feishu:
    enabled: false
    app_id: ""              # cli_ 开头；也可用环境变量 FEISHU_APP_ID
    app_secret: ""         # 建议用环境变量 FEISHU_APP_SECRET 注入，勿提交到仓库
    model: ""              # 空=claude-code，可选 trae/codebuddy/codex
    mention_only: true     # 群聊仅响应 @机器人（私聊始终响应）
    system_prompt: ""
  # 企业微信「智能机器人」（API 模式，WebSocket 长连接）。与飞书渠道相互独立，可同时启用。
  # 前置：管理后台「安全与管理 → 管理工具 → 智能机器人」创建机器人，
  # 启用 API 模式并选择「长连接」接入，复制 Bot ID 与 Secret。
  wecom:
    enabled: false
    bot_id: ""             # 智能机器人 ID；也可用环境变量 WECOM_BOT_ID
    secret: ""             # 建议用环境变量 WECOM_BOT_SECRET 注入，勿提交到仓库
    model: ""              # 空=claude-code，可选 trae/codebuddy/codex
    mention_only: true     # 群聊仅响应 @机器人（单聊始终响应；平台对群聊也只推送 @ 消息）
    system_prompt: ""

mcp:
  work_dir: ""
  trae:
    enabled: true
    command: "trae-mcp"
  claude_code:
    enabled: true
    command: "claude"
  codebuddy:
    enabled: true
    command: "codebuddy-mcp"
  codex:
    enabled: false
    command: "codex"

secrets: {}

log:
  level: info
