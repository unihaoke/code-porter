# CodePorter LocalAgent 配置
# 多租户版本：客户端凭「连接秘钥」接入，不再使用静态 token。
# 密钥建议通过环境变量 AGENT_KEY 注入（见 .env.example），本文件只存非敏感配置。

agent:
  # id 留空：首次启动自动生成 agt_<随机> 并写回本文件（每台机器唯一，请勿手动复制到其他机器）
  id: ""
  # name 留空：首次启动自动取主机名
  name: ""
  # 连接秘钥：在网关控制台「秘钥」页创建（勾选 agent 权限）后粘贴。
  # 生产环境建议留空并通过环境变量 AGENT_KEY 注入，避免写入 yaml。
  key: ""

gateway:
  addr: "http://127.0.0.1:9022"
  timeout: 30s
  insecure_tls: false

pull:
  interval_min: 500ms
  interval_max: 3s
  backoff_factor: 1.6

worker_pool:
  max_concurrency: 2
  queue_size: 4

direct:
  enabled: true
  heartbeat_interval: 20s
  pong_timeout: 60s
  reconnect_min: 1s
  reconnect_max: 30s

health:
  interval: 15s

mcp:
  work_dir: ""
  trae:
    enabled: true
    command: "trae-mcp"
  claude_code:
    enabled: true
    command: "claude"
  codebuddy:
    enabled: true
    command: "codebuddy-mcp"
  codex:
    enabled: false
    command: "codex"

secrets: {}

log:
  level: info
