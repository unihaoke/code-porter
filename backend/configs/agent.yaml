# CodePorter LocalAgent 配置（运行在开发者本机）
agent:
  id: "local-pc"                 # 需与网关侧 agent.id 一致
  token: "change-me-agent-token" # 需与网关侧 agent.token 一致

gateway:
  addr: "http://127.0.0.1:8080"  # 生产环境请用 https://your-domain
  timeout: 30s
  insecure_tls: false            # 自签证书场景可临时置 true

pull:
  interval_min: 500ms            # 有任务时的最快轮询间隔
  interval_max: 3000ms           # 长时间空闲后的最大轮询间隔
  backoff_factor: 1.6

worker_pool:
  max_concurrency: 2             # 最大同时执行的 AI 任务数（保护 IDE，默认 2）
  queue_size: 4                  # 本地内部等待队列长度

direct:
  enabled: true                  # SSE 直连模式（低延迟交互式对话）
  heartbeat_interval: 20s
  pong_timeout: 60s
  reconnect_min: 1s
  reconnect_max: 30s

health:
  interval: 15s                  # 本机健康上报间隔

mcp:
  health_timeout: 5s
  # 每个适配器对应本机已安装并登录的 AI 编码工具
  trae:
    enabled: true
    command: "trae-mcp"          # Trae MCP Server 启动命令
    args: []
    work_dir: ""
    prompt_argument: "prompt"
    request_timeout: 3m
    startup_timeout: 30s
  claude_code:
    enabled: true
    command: "claude"
    args: ["mcp", "serve"]
    prompt_argument: "prompt"
    request_timeout: 3m
    startup_timeout: 30s
  codebuddy:
    enabled: true
    command: "codebuddy-mcp"
    args: []
    prompt_argument: "prompt"
    request_timeout: 3m
    startup_timeout: 30s
  codex:
    enabled: false
    command: "codex"
    args: ["mcp"]
    prompt_argument: "prompt"
    request_timeout: 3m
    startup_timeout: 30s

log:
  level: info
