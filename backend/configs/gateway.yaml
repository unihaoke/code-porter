# CodePorter Gateway 配置（多租户账号体系）
# 环境变量（MYSQL_DSN / AUTH_SESSION_TTL，详见 .env.example）非空时覆盖本文件。

server:
  addr: ":9022"
  read_timeout: 30s
  # SSE 长连接需要较大的写超时（前端对话流式输出）
  write_timeout: 10m
  idle_timeout: 2m
  shutdown_timeout: 20s

database:
  # MySQL DSN；推荐用环境变量 MYSQL_DSN 注入，避免把密码写进配置文件
  # 形如：codeporter:密码@tcp(mysql:3306)/codeporter?parseTime=true&charset=utf8mb4
  dsn: "codeporter:codeporter@tcp(127.0.0.1:3306)/codeporter?parseTime=true&charset=utf8mb4"
  max_open_conns: 20
  max_id_conns: 5
  conn_max_lifetime: 30m

auth:
  # 网页登录会话有效期（小时/天均可：720h、168h、30d）
  session_ttl: 168h

# 本地客户端（agent）不做静态引导：用户在控制台创建秘钥后，
# 客户端凭秘钥 + 自动生成的实例 ID 接入，网关自动注册。

# 网页控制台对话
chat:
  default_model: "claude-code"

# 网页控制台（前端构建产物托管）
web:
  enabled: true
  static_dir: "web/dist"

log:
  level: info

task:
  max_retry: 2
  lock_timeout: 60s
  ttl: 10m
  queue_max_len: 512
  request_timeout: 5m
  stream_idle_timeout: 2m
  mcp_timeout: 3m

rate_limit:
  qps: 10
  burst: 20
  max_inflight: 512

lifecycle:
  lock_sweep_interval: 5s
  ttl_sweep_interval: 30s
  heartbeat_sweep_interval: 10s
  retention_interval: 5m
  task_retention: 30m
  agent_heartbeat_timeout: 30s
