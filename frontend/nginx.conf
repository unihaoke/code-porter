# CodePorter 前端容器的 Nginx 配置
#
# 职责：托管 Vue 构建产物，并把 API / 回调 / 健康检查反代到网关容器。
# 注意 SSE 必须关闭缓冲，否则网页对话会「卡住不吐字」。

# Upgrade 头映射：WebSocket 直连模式需要
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream gateway {
    server gateway:9022;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源：带指纹的资源长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        proxy_pass http://gateway/healthz;
        access_log off;
    }

    # 网页控制台 API
    location /api/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：关闭缓冲与代理缓存，避免流式输出被攒着不发
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # OpenAI 兼容入口（外部客户端如 Cursor 走这里）
    location /v1/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # LocalAgent 轮询 / 上报 / WebSocket 直连
    location /agent/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级（直连模式）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # SPA 回退：交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
