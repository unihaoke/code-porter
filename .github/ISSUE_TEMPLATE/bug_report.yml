name: Bug 报告
description: 报告一个可复现的缺陷
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，信息不足的 Issue 可能会被关闭。
        安全漏洞**不要**在这里提交，请按 [SECURITY.md](../../blob/master/SECURITY.md) 私下报告。

  - type: dropdown
    id: component
    attributes:
      label: 所在组件
      options:
        - 网关 Gateway（backend）
        - 网页控制台（frontend）
        - 桌面客户端（client / Electron）
        - 命令行 Agent
        - 飞书机器人
        - 部署 / Docker
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述与复现步骤
      description: 1. 做了什么 2. 期望发生什么 3. 实际发生了什么
      placeholder: |
        1. 启动网关 / 客户端 ...
        2. 在控制台发起对话 ...
        3. 报错 / 无响应 ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / 截图
      description: 请粘贴客户端「运行日志」页、`docker compose logs gateway` 或 Go 日志的相关片段（注意脱敏，不要贴秘钥）
      render: text

  - type: input
    id: version
    attributes:
      label: 版本 / 环境
      placeholder: '例如：CodePorter v0.2.0；Windows 11 + Node 20.19；Ubuntu 22.04 + Docker'

  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 我已搜索过现有 Issue，没有重复报告
          required: true
        - label: 我已升级到最新版本（或最新 master），问题仍存在
          required: false
        - label: 我会在日志中隐去秘钥、App Secret 等敏感信息
          required: true
