name: 功能建议
description: 提出新功能或改进建议
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: 欢迎提出想法！请描述清楚使用场景，帮助我们评估方案与优先级。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / 使用场景
      description: 你遇到了什么不便？谁会受益于此功能？
      placeholder: '例如：我希望网关能……，因为目前……'
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      placeholder: 描述你希望的交互 / 接口 / 行为，有设计草图更好

  - type: dropdown
    id: component
    attributes:
      label: 涉及组件
      multiple: true
      options:
        - 网关 Gateway
        - 网页控制台
        - 桌面客户端
        - 命令行 Agent
        - 飞书 / IM 机器人
        - 文档
        - 其他

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 目前你是怎么绕过这个问题的？

  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 我已搜索过现有 Issue / 路线图，没有重复提议
          required: true
        - label: 我愿意参与实现或测试该功能
          required: false
